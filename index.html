<!doctype html>
<html lang="en">

<style>
:root {
  --ink: #0B0D12; --card: #151922; --card-2: #1C212C; --line: #2A3040;
  --paper: #F2EEE6; --mist: #B9B5C3; --dim: #7A7787;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ink); color: var(--paper); font-family: var(--head); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input { font: inherit; }
.tag { display: inline-flex; align-items: center; gap: 8px; background: var(--lime); color: var(--ink); font: 700 12px/1 var(--mono);
  letter-spacing: .08em; text-transform: uppercase; padding: 7px 10px; }
.tag.red { background: var(--red); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.live .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.mono { font-family: var(--mono); font-weight: 700; }

  letter-spacing: .12em; text-transform: uppercase; transform: rotate(-7deg); background: rgba(11,13,18,.55); }
.stamp.slam { animation: slam .32s cubic-bezier(.55,0,1,.45) both; }

@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── voter (phone) ─────────────────────────────────────────── */

.name { width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 10px; color: var(--paper); padding: 14px 14px;
  font: 500 18px/1 var(--head); outline: none; margin-bottom: 20px; }
.name:focus { border-color: var(--lime); }
.cases { display: grid; gap: 10px; margin-bottom: 18px; }
.case { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; text-align: left; background: var(--card);
  border: 2px solid var(--line); border-radius: 12px; padding: 14px 14px; transition: border-color .15s, background .15s, transform .1s; }
.case:active { transform: scale(.99); }
.case .n { font: 900 34px/1 var(--head); color: var(--lime); }
.case .t { font: 800 18px/1.15 var(--head); }
.case .s { font: 400 14px/1.35 var(--head); color: var(--mist); margin-top: 3px; }
.case .pick { font: 700 11px/1 var(--mono); letter-spacing: .1em; color: var(--dim); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 10px; }
.case[aria-pressed="true"] { border-color: var(--lime); background: #1b2211; }
.case[aria-pressed="true"] .pick { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.submit { width: 100%; background: var(--lime); color: var(--ink); border-radius: 12px; padding: 18px; font: 900 19px/1 var(--head); letter-spacing: .02em; }
.submit:disabled { background: var(--card-2); color: var(--dim); cursor: not-allowed; }

.panel { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 20px 18px; margin-top: 18px; }
.center { text-align: center; }
.big-stamp { margin: 26px auto 8px; font-size: 27px; }

.conn.ok { color: var(--lime); }

/* ── host (big screen): an evidence board ─────────────────── */
.host { position: relative; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(300px, 29%) 1fr; grid-template-rows: auto 1fr auto;
  gap: 0 3.5vw; padding: 3vh 3.5vw 2.2vh; overflow: hidden; background: #1f1912 url('../img/cork.jpg') repeat; background-size: 384px; }
.host::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 55% 45%, transparent 35%, rgba(0,0,0,.6) 100%); }
.host > * { position: relative; }
.host header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.4vh; }
.host .left { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding-top: .6vh; }
.host h1 { font: 900 clamp(42px, 6vw, 104px)/.9 var(--head); letter-spacing: -.015em; text-shadow: 0 3px 18px rgba(0,0,0,.6); }
.host h1 em { font-style: normal; color: var(--lime); }
.host .sub { color: #D9D4CB; font: 400 clamp(15px, 1.3vw, 22px)/1.4 var(--head); margin: 2vh 0 3.2vh; max-width: 30ch; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
/* pinned paper notes: the QR card and the awards */
.note { position: relative; background: var(--paper); color: var(--ink); border-radius: 3px; box-shadow: 0 10px 24px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.4); }
.note::before { content: ''; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translateX(-50%);
  background: radial-gradient(circle at 35% 30%, #ff9a8f 0 18%, #d62c26 22% 100%); box-shadow: 0 3px 5px rgba(0,0,0,.5); }
.join { display: flex; gap: 18px; align-items: center; padding: 16px 18px; transform: rotate(-1.3deg); }
.qr { background: #fff; padding: 6px; line-height: 0; flex: none; }
.qr img, .qr canvas { width: clamp(112px, 11vw, 190px) !important; height: auto !important; }
.join .how { font: 400 clamp(20px, 1.9vw, 32px)/1.05 'Permanent Marker', var(--head); color: var(--ink); }
.join .url { font: 700 clamp(11px, .85vw, 14px)/1.35 var(--mono); color: #3a3844; word-break: break-all; margin-top: 8px; }
.total { margin-top: 2.6vh; }
.total .cap { font: 700 clamp(14px, 1.3vw, 22px)/1.3 var(--mono); color: var(--lime); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
.feed { font: 700 clamp(12px, 1vw, 16px)/1.5 var(--mono); color: #A9A39A; margin-top: 10px; min-height: 1.5em; }
.feed b { color: var(--paper); }
/* the board: three pinned polaroids joined by red string */
.board { position: relative; display: flex; align-items: center; min-height: 0; }
.strings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.polaroids { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4vw; width: 100%; align-items: start; }
.pcol { min-width: 0; }
.polaroid { position: relative; margin: 0; background: #F4F0E8; padding: .7vw .7vw 0; box-shadow: 0 14px 28px rgba(0,0,0,.6), 0 3px 6px rgba(0,0,0,.4);
  transform: rotate(var(--rot)); transform-origin: 50% 0; transition: transform 1.2s cubic-bezier(.3, 1.55, .45, 1) var(--swing-delay, 0ms); }
.pin { position: absolute; z-index: 4; top: -.55vw; left: 50%; width: clamp(14px, 1.15vw, 22px); aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%);
  background: radial-gradient(circle at 35% 30%, #ff9a8f 0 18%, #d62c26 22% 100%); box-shadow: 0 3px 6px rgba(0,0,0,.55); }
.photo { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .8s; }
.polaroid figcaption { font: 400 clamp(14px, 1.45vw, 27px)/1.2 'Permanent Marker', cursive; color: #1d1c22; text-align: center; padding: 1vh .3vw 1.3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stampwrap { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.stampwrap .stamp { font-size: clamp(22px, 2.6vw, 46px); }
.pcol .meta { display: flex; justify-content: flex-end; margin: 2.2vh 0 .9vh; }
.pcol .count { font: 700 clamp(15px, 1.4vw, 24px)/1 var(--mono); color: #CFC9BF; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
.pcol .count b { color: var(--paper); font-size: 1.3em; }
.pcol .bar-track { height: clamp(14px, 2.2vh, 28px); background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 1.2vh; min-height: 26px; }
.chip { font: 700 clamp(11px, .9vw, 15px)/1 var(--mono); background: rgba(14,16,21,.9); color: var(--paper); border-radius: 999px; padding: 6px 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.4); animation: rise .4s both; }
.chip.more { color: var(--dim); }
/* the verdict */
.pcol.lie .stamp { color: var(--red); } .pcol.true .stamp { color: var(--lime); }
.pcol.lie .bar-fill { background: var(--red); }
.pcol.true .bar-fill { background: var(--dim); }
.pcol.true .photo img { filter: saturate(.55) brightness(.85); }
.pcol.lie figcaption { color: #C2382C; }
.pcol.lie .polaroid { transform: rotate(8deg) translate(.3vw, 1vh); transform-origin: 10% 2%; }
.pcol .meta { transition: margin-top .9s cubic-bezier(.3, 1.55, .45, 1) var(--swing-delay, 0ms); }
.pcol.lie .meta { margin-top: 7.5vh; }
.pcol.lie .pin { animation: pinPop .45s cubic-bezier(.5,0,.75,0) var(--swing-delay, 0ms) forwards; }
@keyframes pinPop { to { transform: translate(-50%, -6vh) scale(.5); opacity: 0; } }
.pcol.lie .chip { background: #3a1a18; }
.host footer { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 2vh; }
.ctl { background: rgba(11,13,18,.82); font: 700 13px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 14px; color: var(--mist); }
.ctl:hover { border-color: var(--mist); color: var(--paper); }
.ctl.primary { border-color: var(--lime); color: var(--lime); }
.ctl.danger { border-color: #5a2522; color: var(--red); }
.ctl.reveal { background: var(--red); border-color: var(--red); color: var(--ink); font-size: 15px; padding: 13px 22px; }
.ctl.reveal:hover { color: var(--ink); filter: brightness(1.1); }
.spacer { flex: 1; }
.overlay { position: fixed; inset: 0; background: rgba(11,13,18,.92); display: grid; place-items: center; z-index: 10; }
.count-num { font: 900 min(52vh, 40vw)/1 var(--head); color: var(--lime); animation: punch .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes punch { from { transform: scale(1.6); opacity: 0; } 25% { opacity: 1; } 80% { transform: scale(1); opacity: 1; } to { opacity: 0; } }
.overlay .stamp { font-size: min(12vh, 9vw); color: var(--red); }
.confetti { position: absolute; top: -20px; width: 10px; height: 16px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.cbtn { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 6px; display: grid; gap: 6px; justify-items: center;
  font: 700 13px/1.15 var(--head); color: var(--mist); text-align: center; }
.cbtn .ce { font-size: 26px; line-height: 1; }
.cbtn[aria-pressed="true"] { border-color: var(--lime); background: #1b2211; color: var(--paper); }
.react { margin-top: 18px; }
.react-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rbtn { font-size: 30px; line-height: 1; padding: 12px 0; background: var(--card); border: 2px solid var(--line); border-radius: 12px; transition: transform .08s; }
.rbtn:active { transform: scale(.9); background: var(--card-2); }
.react .fine { margin-top: 8px; }
.float { position: absolute; bottom: -60px; pointer-events: none; font-size: clamp(30px, 3.2vw, 56px); line-height: 1;
  animation: floatUp var(--dur, 4s) cubic-bezier(.2,.6,.3,1) forwards; }
@keyframes floatUp { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translate(0, -12vh) scale(1); }
  100% { transform: translate(var(--sway, 20px), -105vh) scale(1.1); opacity: 0; } }
.voter .float { font-size: 34px; }
.awards { display: grid; gap: 2.4vh; margin-top: 1.4vh; }
.award { --r: -1.2deg; padding: 1.6vh 1.2vw 1.4vh; display: grid; grid-template-columns: auto 1fr; gap: 0 1vw; align-items: center;
  opacity: 0; animation: noteIn .55s cubic-bezier(.2,.8,.2,1) forwards; }
.award.bad { --r: 1.4deg; }
@keyframes noteIn { from { opacity: 0; transform: translateY(16px) rotate(var(--r)); } to { opacity: 1; transform: rotate(var(--r)); } }
.award .icon { font-size: clamp(30px, 3vw, 52px); line-height: 1; }
.award .what { font: 700 clamp(11px, .9vw, 15px)/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.award .who { font: 400 clamp(24px, 2.4vw, 42px)/1.05 'Permanent Marker', var(--head); margin: .4vh 0; overflow-wrap: anywhere; color: var(--ink); }
.award .why { font: 400 clamp(13px, 1.05vw, 18px)/1.3 var(--head); color: #4A4854; }
.award.gold .what { color: #8A6A08; } .award.bad .what { color: #C2382C; }
.chips .chip.chief { background: #E8C547; color: var(--ink); }
.chips .chip.mcw { background: var(--red); color: var(--ink); }
.fx-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 15; }
@media (max-width: 860px) {
  .host { height: auto; display: block; padding: 20px 16px; }
  .host .board { margin-top: 28px; }
  .polaroids { grid-template-columns: 1fr; gap: 34px; }
  .total { margin-top: 22px; }
  .host footer { opacity: 1; margin-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<main id="app" aria-live="polite"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Kay's Case File: live "two truths, one lie" vote.
// Phones open the plain URL; the tally screen is /results/ (the only file that knows the answer).
// Votes travel through a public ntfy.sh channel (no accounts, messages kept 12 hours).
const TOPIC = 'kay-casefile-45e8996732438867';
const RELAY = 'https://ntfy.sh/' + TOPIC;

const CASES = [
  { n: '01', t: 'The birthday bet', s: 'Rock Paper Scissors decided. I jumped.', img: 'bungee', rot: -3 },
  { n: '02', t: 'The test centre', s: 'Four attempts. Four brand-new ways to fail.', img: 'car', rot: 2.2 },
  { n: '03', t: 'The golden circle', s: 'Paid for standing. Watched Green Day from the front.', img: 'concert', rot: -2.4 },
];
const CONF = [['\u{1F914}', 'Just a hunch'], ['\u{1F9D0}', 'Pretty sure'], ['\u{1F96A}', 'I\u2019d bet my lunch']];
const EMOJI = ['\u{1F602}', '\u{1F914}', '\u{1F6A8}', '\u{1F644}', '\u{1F631}'];
const IS_HOST = /\/results(\/|\/index\.html)?$/.test(location.pathname);
const LIE = IS_HOST ? Number(window.CASE_LIE) || 0 : 0;
const VOTER_URL = location.origin + location.pathname.replace(/results(\/|\/index\.html)?$/, '');
const $app = document.getElementById('app');

// ── tiny helpers ──────────────────────────────────────────────
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get(k) { try { return localStorage.getItem('kcf:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('kcf:' + k, v); } catch {} },
};
const cleanName = (s) => String(s ?? '').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯]/g, '').trim().slice(0, 24) || 'Anonymous';
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
let myId = store.get('id');
if (!myId) { myId = Math.random().toString(36).slice(2, 12); store.set('id', myId); }

// ── shared state: every message is replayed and reduced into one state ──
const messages = new Map();
const seenReacts = new Set();
const LOADED_AT = Date.now() / 1000;
let arrival = 0, lastTime = 0;
let state = reduce();
let connected = false;

function ingest(m) {
  if (!m || m.event !== 'message' || messages.has(m.id)) return;
  let d; try { d = JSON.parse(m.message); } catch { return; }
  if (!d || typeof d !== 'object') return;
  if (d.t === 'react') {
    // Reactions are moments, not state: only float the ones sent since this page opened.
    if (seenReacts.has(m.id)) return;
    seenReacts.add(m.id);
    if (IS_HOST && m.time >= LOADED_AT - 3 && d.r === state.round) floatReactions(d.e);
    return;
  }
  messages.set(m.id, { time: m.time, seq: arrival++, d });
  lastTime = Math.max(lastTime, m.time || 0);
  scheduleRender();
}

function reduce() {
  const fresh = (round) => ({ round, locked: false, answer: 0, votes: new Map(), order: [] });
  let S = fresh('r0');
  const list = [...messages.values()].sort((a, b) => a.time - b.time || a.seq - b.seq);
  for (const { d, time } of list) {
    if (d.t === 'reset' && typeof d.r === 'string') { S = fresh(d.r); continue; }
    if (d.r !== S.round) continue;
    if (d.t === 'vote') {
      const p = Number(d.p);
      if (S.locked || S.answer || ![1, 2, 3].includes(p) || typeof d.v !== 'string' || S.votes.has(d.v)) continue;
      const c = Number(d.c);
      S.votes.set(d.v, { p, c: [1, 2, 3].includes(c) ? c : 0, name: cleanName(d.n), time });
      S.order.push(d.v);
    } else if (d.t === 'lock') S.locked = true;
    else if (d.t === 'unlock' && !S.answer) S.locked = false;
    else if (d.t === 'reveal' && [1, 2, 3].includes(Number(d.a))) { S.answer = Number(d.a); S.locked = true; }
  }
  S.counts = [0, 0, 0];
  for (const v of S.votes.values()) S.counts[v.p - 1]++;
  S.total = S.votes.size;
  return S;
}

async function send(d) {
  for (let attempt = 0; attempt < 7; attempt++) {
    try {
      const r = await fetch(RELAY, { method: 'POST', body: JSON.stringify(d) });
      if (r.ok) { ingest(await r.json()); return true; }
      if (r.status !== 429 && r.status < 500) return false;
    } catch {}
    await sleep(Math.min(1200 * 2 ** attempt, 15000));
  }
  return false;
}

// Host commands show on the tally screen at once, then go to the relay (a slow relay never stalls the show).
function command(d) {
  ingest({ id: 'local-' + Math.random().toString(36).slice(2), time: lastTime, event: 'message', message: JSON.stringify(d) });
  return send(d);
}

function connect() {
  const es = new EventSource(RELAY + '/sse?since=all');
  es.addEventListener('open', () => { connected = true; scheduleRender(); });
  es.onmessage = (e) => { try { ingest(JSON.parse(e.data)); } catch {} };
  es.onerror = () => { connected = false; scheduleRender(); };
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; const prev = state; state = reduce(); (IS_HOST ? renderHost : renderVoter)(prev); });
}

// ══ VOTER ════════════════════════════════════════════════════
const ui = { name: store.get('name') || '', pick: 0, conf: 0, sending: false, error: '' };
let voterScreen = '';
let loadTimedOut = false;

function renderVoter(prev) {
  const mine = state.votes.get(myId);
  const screen = !connected && !messages.size && !loadTimedOut ? 'loading'
    : mine ? 'voted'
    : state.locked ? 'closed'
    : 'form';
  // The form keeps its own DOM while open so typing isn't interrupted.
  if (screen === 'form' && voterScreen === 'form') { updateForm(); return; }
  const changed = screen !== voterScreen || prev.round !== state.round;
  voterScreen = screen;
  if (!changed && screen !== 'loading') { document.querySelector('.voter .status')?.replaceWith(voterHeader()); return; }

// ── reactions: taps are bundled so a busy room can't swamp the relay ──
const REACT_GAP = 4000, REACT_MAX_SENDS = 15;
const pendingReacts = {};
let reactTimer = null, lastReactSend = 0, reactSends = 0, reactRound = null;

function reactBar() {
  return h('div', { class: 'react' },
    h('p', { class: 'label' }, 'React on the big screen'),
    h('div', { class: 'react-row' }, EMOJI.map((e) => h('button', { class: 'rbtn', 'aria-label': 'React ' + e, onclick: () => tapReact(e) }, e))),
    h('p', { class: 'fine', id: 'react-note' }));
}

function tapReact(e) {
  if (reactRound !== state.round) { reactRound = state.round; reactSends = 0; }
  floatOne(e, 10 + Math.random() * 80);
  if (reactSends >= REACT_MAX_SENDS) { const n = document.getElementById('react-note'); if (n) n.textContent = 'Easy, tiger. The big screen has heard you.'; return; }
  pendingReacts[e] = Math.min((pendingReacts[e] || 0) + 1, 5);
  if (!reactTimer) reactTimer = setTimeout(flushReacts, Math.max(0, lastReactSend + REACT_GAP - Date.now()));
}

function flushReacts() {
  reactTimer = null;
  const e = { ...pendingReacts };
  for (const k of Object.keys(pendingReacts)) delete pendingReacts[k];
  if (!Object.keys(e).length) return;
  lastReactSend = Date.now(); reactSends++;
  // One attempt only: reactions are nice-to-have and must never queue up behind votes.
  fetch(RELAY, { method: 'POST', body: JSON.stringify({ t: 'react', r: state.round, e }) }).catch(() => {});
}

// Floating emoji and confetti live in one clipped layer so they can never widen the page.
function fxLayer() {
  let l = document.getElementById('fx');
  if (!l) { l = h('div', { class: 'fx-layer', id: 'fx', 'aria-hidden': 'true' }); document.body.append(l); }
  return l;
}

function floatOne(e, leftVw, delay = 0) {
  if (document.querySelectorAll('.float').length > 45) return;
  const f = h('span', { class: 'float', 'aria-hidden': 'true' }, e);
  f.style.left = leftVw + 'vw';
  f.style.setProperty('--sway', (Math.random() * 60 - 30).toFixed(0) + 'px');
  f.style.setProperty('--dur', (3.4 + Math.random() * 1.6).toFixed(2) + 's');
  f.style.animationDelay = delay + 'ms';
  fxLayer().append(f);
  setTimeout(() => f.remove(), 5400 + delay);
}

function floatReactions(e) {
  if (!e || typeof e !== 'object') return;
  let shown = 0;
  for (const [emoji, n] of Object.entries(e)) {
    if (!EMOJI.includes(emoji)) continue;
    const count = Math.min(Math.max(Number(n) || 0, 0), 5);
    for (let i = 0; i < count && shown < 8; i++, shown++) floatOne(emoji, 62 + Math.random() * 34, i * 180);
  }
}

function voterClosed() {

    h('div', { class: 'center' }, h('div', { class: 'stamp slam big-stamp', style: 'color:var(--red)' }, 'Votes locked')),

// Sound effects are synthesised in the page; browsers allow audio after the first click on the page.
const sfx = (() => {
  let ctx = null, on = store.get('sound') !== 'off';
  const unlock = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
    if (ctx.state === 'suspended') ctx.resume();
  };
  addEventListener('pointerdown', unlock); addEventListener('keydown', unlock);
  function tone({ f = 440, f2 = 0, type = 'sine', dur = .2, vol = .2, at = 0, lp = 0 }) {
    if (!on || !ctx) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = o.connect(g);
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; node = node.connect(fl); }
    node.connect(ctx.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise({ dur = .15, vol = .3, at = 0, lp = 700 }) {
    if (!on || !ctx) return;
    const t = ctx.currentTime + at, buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) ** 2;
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = lp; g.gain.value = vol;
    src.connect(fl).connect(g).connect(ctx.destination); src.start(t);
  }
  return {
    get on() { return on; },
    toggle() { on = !on; store.set('sound', on ? 'on' : 'off'); unlock(); if (on) this.blip(); },
    tick() { tone({ f: 1500, type: 'square', dur: .045, vol: .09, lp: 4000 }); tone({ f: 1000, type: 'square', dur: .04, vol: .06, at: .45, lp: 4000 }); },
    thud(at = 0) { tone({ f: 150, f2: 42, dur: .38, vol: .7, at }); noise({ dur: .14, vol: .45, at, lp: 900 }); },
    blip() { tone({ f: 880, f2: 1320, type: 'triangle', dur: .13, vol: .08 }); },
    sting() {
      const note = (f, at, dur) => { tone({ f, type: 'sawtooth', dur, vol: .16, at, lp: 1400 }); tone({ f: f / 2, type: 'sawtooth', dur, vol: .14, at, lp: 900 }); };
      note(220, 0, .3); note(208, .36, .3); note(165, .74, 1.5);
    },
    fanfare(at = 0) { [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'triangle', dur: .22 + (i === 3 ? .4 : 0), vol: .12, at: at + i * .11 })); },
    womp(at = 0) { [311, 294, 277, 220].forEach((f, i) => tone({ f, f2: i === 3 ? 180 : 0, type: 'sawtooth', dur: i === 3 ? .7 : .28, vol: .1, at: at + i * .3, lp: 1100 })); },
  };
})();

let hostSettled = false;

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function drawStrings() {
  const svg = document.getElementById('strings'), board = document.getElementById('board');
  if (!svg || !board) return;
  const b = board.getBoundingClientRect();
  const pins = CASES.map((_, i) => {
    const r = document.getElementById('pin' + i).getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top, gone: state.answer === i + 1 };
  });
  const sag = (a, c, droop) => `M ${a.x} ${a.y} Q ${(a.x + c.x) / 2} ${(a.y + c.y) / 2 + droop} ${c.x} ${c.y}`;
  const lines = [[0, 1, 26], [1, 2, 26], [0, 2, 70]].filter(([i, j]) => !pins[i].gone && !pins[j].gone);
  svg.replaceChildren(...lines.map(([i, j, d], k) => svgEl('path', { d: sag(pins[i], pins[j], d), fill: 'none',
    stroke: k === 2 ? '#a8211c' : '#c8261f', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .95 })));
}

function renderHost(prev) {
  if (!hostBuilt) buildHost();
  const S = state;
  if (lastRound !== S.round) { seenVoters.clear(); lastRound = S.round; }
  const conn = document.getElementById('conn');
  conn.className = 'conn' + (connected ? ' ok' : ''); conn.textContent = connected ? '● live' : '○ connecting…';

  const tag = document.getElementById('h-tag');
  tag.classList.toggle('red', Boolean(S.locked || S.answer));
  document.getElementById('h-tagtext').textContent = S.answer ? 'Case file / verdict' : S.locked ? 'Case file / votes locked' : 'Case file / live results';
  const right = S.answer ? S.counts[S.answer - 1] : 0;
  document.getElementById('h-sub').textContent = S.answer
    ? `${right} of ${S.total} ${S.total === 1 ? 'detective' : 'detectives'} cracked it. Everyone else: fooled.`
    : S.locked ? 'Votes are locked. No take-backs. Time for the truth.'
    : 'Two truths. One lie. Scan the code, add your name and pick your suspect.';
  document.getElementById('h-join').classList.toggle('hidden', Boolean(S.answer));
  const title = document.getElementById('h-title');
  if (title.dataset.mode !== String(Boolean(S.answer))) {
    title.dataset.mode = String(Boolean(S.answer));
    title.replaceChildren(...(S.answer ? ['Case', h('br'), h('em', { style: 'color:var(--red)' }, 'closed.')] : ['Pin ', h('br'), h('em', {}, 'the lie.')]));
  }
  document.getElementById('h-cap').textContent = S.answer ? `${pct(right, S.total)}% of the room got it right`
    : `${S.total} ${S.total === 1 ? 'vote' : 'votes'} in`;

  const latest = S.order.slice(-3).reverse().map((id) => S.votes.get(id).name);
  const feed = document.getElementById('h-feed');
  feed.replaceChildren(...(latest.length && !S.answer ? ['Latest: ', ...latest.flatMap((n, i) => [i ? ', ' : '', h('b', {}, n)])] : []));

  const awards = S.answer ? computeAwards(S) : null;
  const firstReveal = S.answer && lastAnswer !== S.answer && prev && prev.round === S.round;
  // Reveal order: TRUE stamps land one by one, then LIE, then the awards.
  const stampOrder = S.answer ? [0, 1, 2].filter((i) => i + 1 !== S.answer).concat(S.answer - 1) : [];
  const stampDelay = (i) => (firstReveal ? 1100 + stampOrder.indexOf(i) * 750 : 0);
  CASES.forEach((c, i) => {
    const row = document.getElementById('row' + i);
    const isLie = S.answer === i + 1;
    row.classList.toggle('lie', isLie);
    row.classList.toggle('true', Boolean(S.answer) && !isLie);
    document.getElementById('count' + i).replaceChildren(h('b', {}, S.counts[i]), `  ${pct(S.counts[i], S.total)}%`);
    document.getElementById('bar' + i).style.width = pct(S.counts[i], S.total) + '%';
    const stamp = document.getElementById('stamp' + i);
    stamp.classList.toggle('hidden', !S.answer);
    if (S.answer && lastAnswer !== S.answer) {
      stamp.textContent = isLie ? 'Lie' : 'True'; stamp.classList.remove('slam'); void stamp.offsetWidth;
      stamp.style.animationDelay = stampDelay(i) + 'ms'; stamp.classList.add('slam');
      if (firstReveal) sfx.thud(stampDelay(i) / 1000 + .3);
    }
    const chips = document.getElementById('chips' + i);
    const names = S.order.filter((id) => S.votes.get(id).p === i + 1);
    if (!showNames) { chips.replaceChildren(); return; }
    const shown = names.slice(-14);
    chips.replaceChildren(...shown.map((id) => {
      const v = S.votes.get(id);
      const chip = h('span', { class: 'chip' + (awards && id === awards.chief ? ' chief' : '') + (awards && id === awards.mcw ? ' mcw' : '') },
        (awards && id === awards.chief ? '\u2605 ' : '') + v.name + (v.c === 3 ? ' \u{1F96A}' : ''));
      if (seenVoters.has(id)) chip.style.animation = 'none';
      return chip;
    }), ...(names.length > shown.length ? [h('span', { class: 'chip more' }, `+${names.length - shown.length} more`)] : []));
  });
  S.order.forEach((id) => seenVoters.add(id));

  document.getElementById('b-lock').classList.toggle('hidden', Boolean(S.locked));
  document.getElementById('b-unlock').classList.toggle('hidden', !S.locked || Boolean(S.answer));
  document.getElementById('b-reveal').classList.toggle('hidden', Boolean(S.answer));
  document.getElementById('b-names').textContent = showNames ? 'Hide names' : 'Show names';
  document.getElementById('b-sound').textContent = sfx.on ? 'Sound: on' : 'Sound: off';

  const awardsEl = document.getElementById('h-awards');
  awardsEl.classList.toggle('hidden', !S.answer);
  if (S.answer && lastAnswer !== S.answer) renderAwards(awardsEl, awards, firstReveal ? 1100 + 3 * 750 + 400 : 0);

  if (S.answer) {
    const lie = document.getElementById('row' + (S.answer - 1));
    lie.style.setProperty('--swing-delay', (firstReveal ? stampDelay(S.answer - 1) + 380 : 0) + 'ms');
    setTimeout(drawStrings, firstReveal ? stampDelay(S.answer - 1) + 400 : 0);
  } else drawStrings();
  if (firstReveal) {
    sfx.sting();
    setTimeout(confetti, stampDelay(S.answer - 1) + 250);
  }
  if (!S.answer && prev && prev.round === S.round && S.total > prev.total && hostSettled) sfx.blip();
  lastAnswer = S.answer;
}

function computeAwards(S) {
  const right = S.order.filter((id) => S.votes.get(id).p === S.answer);
  const wrong = S.order.filter((id) => S.votes.get(id).p !== S.answer);
  let mcw = null;
  for (const id of wrong) if (!mcw || S.votes.get(id).c > S.votes.get(mcw).c) mcw = id;
  return { chief: right[0] || null, mcw, lunches: wrong.filter((id) => S.votes.get(id).c === 3).length };
}

function renderAwards(el, a, delay) {
  const S = state;
  const chief = a.chief && S.votes.get(a.chief);
  const mcw = a.mcw && S.votes.get(a.mcw);
  const mcwWhy = !mcw ? 'Nobody got fooled. Impressive.'
    : mcw.c === 3 ? `Bet their lunch on Case ${CASES[mcw.p - 1].n}.`
    : mcw.c === 2 ? `Was \u201cpretty sure\u201d it was Case ${CASES[mcw.p - 1].n}.`
    : `Had a hunch about Case ${CASES[mcw.p - 1].n}.`;
  const card = (cls, icon, what, who, why, d) => {
    const c = h('div', { class: 'award note ' + cls }, h('div', { class: 'icon' }, icon),
      h('div', {}, h('div', { class: 'what' }, what), h('div', { class: 'who' }, who), h('div', { class: 'why' }, why)));
    c.style.animationDelay = d + 'ms';
    return c;
  };
  el.replaceChildren(
    card('gold', '\u{1F3C5}', 'Chief Inspector', chief ? chief.name : 'Nobody', chief ? 'First to crack the case.' : 'Kayleigh fooled the entire room.', delay),
    card('bad', '\u{1F96A}', 'Most confidently wrong', mcw ? mcw.name : 'Nobody', mcwWhy + (a.lunches > 1 ? ` (${a.lunches} lunches lost in total.)` : ''), delay + 1100));
  if (delay) { sfx.fanfare(delay / 1000); sfx.womp((delay + 1100) / 1000); }
}

  ov.replaceChildren(h('div', { class: 'stamp slam' }, 'Votes locked'));

  ov.remove();
}

function resetRound() {
  if (!confirm('Start a new round? This clears every vote on the big screen and on phones.')) return;
  send({ t: 'reset', r: 'r' + Date.now().toString(36) });
  document.querySelectorAll('.float').forEach((f) => f.remove());
}

async function copyLink() {
  const b = document.getElementById('b-copy');
  try { await navigator.clipboard.writeText(VOTER_URL); b.textContent = 'Copied'; } catch { b.textContent = VOTER_URL; }
  setTimeout(() => { b.textContent = 'Copy voter link'; }, 2000);
}

function confetti() {
  const colors = ['#C9FF3D', '#F2EEE6', '#FF4B3E'];
  for (let i = 0; i < 90; i++) {
    const p = h('span', { class: 'confetti' });
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % 3];
    p.style.animationDuration = 2.2 + Math.random() * 2 + 's';
    p.style.animationDelay = Math.random() * .6 + 's';
    fxLayer().append(p);
    setTimeout(() => p.remove(), 5200);
  }
}

// ── go ────────────────────────────────────────────────────────
if (IS_HOST) document.title = "Kay's Case File · Live Results";
(IS_HOST ? renderHost : renderVoter)(state);
connect();
// If the relay is slow to answer, show the form anyway so nobody is stuck on a spinner.
setTimeout(() => { loadTimedOut = true; if (!IS_HOST) scheduleRender(); }, 4000);
</script>
</body>
</html>
